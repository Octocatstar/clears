<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F4C2D7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Clears — play the day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,650;1,9..144,500&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #fff8f4;
      --blush: #fde8f0;
      --pink: #f4c2d7;
      --bloom: #e89bb5;
      --lilac: #cbb6e8;
      --violet: #9a7bb8;
      --ink: #3a2f45;
      --mute: #6f627a;
      --card: rgba(255, 255, 255, 0.72);
      --gold: #d4a017;
      --mint: #bfe8d2;
      --shadow: 0 18px 50px rgba(154, 123, 184, 0.18);
      --radius: 28px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Nunito, system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 700px at -10% -20%, #f8d5e6 0%, transparent 55%),
        radial-gradient(900px 600px at 110% 0%, #ddd0f5 0%, transparent 50%),
        radial-gradient(800px 500px at 50% 120%, #fde2c8 0%, transparent 45%),
        var(--cream);
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    h1, h2, h3, .serif { font-family: Fraunces, Georgia, serif; font-weight: 650; }
    .app {
      width: min(430px, 100%);
      min-height: 100dvh;
      margin: 0 auto;
      padding: 18px 16px 108px;
      position: relative;
    }
    .top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .brand { display: flex; gap: 10px; align-items: center; }
    .logo {
      width: 42px; height: 42px; border-radius: 16px;
      background: linear-gradient(135deg, var(--pink), var(--lilac));
      display: grid; place-items: center; font-size: 20px;
      box-shadow: var(--shadow);
    }
    .brand small { display: block; color: var(--mute); font-weight: 600; margin-top: -2px; }
    .pills { display: flex; gap: 8px; }
    .stat {
      background: var(--card); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 999px; padding: 8px 12px; font-weight: 800; font-size: 13px;
    }
    .hero, .card {
      background: var(--card); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,.85);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 18px;
      margin-bottom: 14px;
    }
    .kicker {
      text-transform: uppercase; letter-spacing: .12em;
      font-size: 11px; font-weight: 800; color: var(--violet); margin: 0 0 6px;
    }
    .hero h2 { margin: 0 0 8px; font-size: 28px; line-height: 1.15; }
    .lede { margin: 0; color: var(--mute); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .chip, .btn, .navbtn {
      border: 0; border-radius: 999px; padding: 10px 14px; font-weight: 800;
      background: #fff; color: var(--ink);
    }
    .chip.on, .btn.primary {
      background: linear-gradient(135deg, var(--bloom), var(--violet));
      color: #fff;
    }
    .btn.ghost { background: #fff; }
    .btn.wide { width: 100%; margin-top: 12px; padding: 14px; }
    .btn.calm { background: var(--mint); }
    .row { display: flex; gap: 8px; }
    .row .btn { flex: 1; }
    .quest {
      display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center;
      width: 100%; text-align: left; background: #fff; border: 0;
      border-radius: 22px; padding: 12px; margin-bottom: 8px;
    }
    .badge {
      width: 52px; height: 52px; border-radius: 18px; display: grid; place-items: center;
      font-size: 24px; background: var(--blush);
    }
    .quest b { display: block; }
    .meta { color: var(--mute); font-size: 13px; font-weight: 700; }
    .xp { font-weight: 800; color: var(--violet); font-size: 13px; }
    .dock {
      position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
      width: min(400px, calc(100% - 20px));
      display: grid; grid-template-columns: repeat(5, 1fr);
      background: rgba(255,255,255,.86); backdrop-filter: blur(18px);
      border-radius: 28px; padding: 8px; box-shadow: var(--shadow);
    }
    .navbtn { background: transparent; padding: 8px 4px; font-size: 11px; }
    .navbtn span { display: block; font-size: 18px; }
    .navbtn.on { background: var(--blush); }
    .step {
      background: linear-gradient(180deg, #fff, var(--blush));
      border-radius: 24px; padding: 20px; text-align: center; margin: 12px 0;
    }
    .step p { font-size: 22px; font-family: Fraunces, serif; margin: 8px 0 0; }
    .player {
      display: flex; align-items: center; gap: 12px;
      background: #2b2233; color: #fff; border-radius: 22px; padding: 12px;
    }
    .eq {
      width: 44px; height: 44px; border-radius: 14px;
      background: linear-gradient(135deg, var(--bloom), var(--violet));
      display: flex; align-items: end; justify-content: center; gap: 3px; padding: 10px 0;
    }
    .eq i {
      width: 4px; background: #fff; border-radius: 4px; display: block;
      animation: bounce 1s ease-in-out infinite;
    }
    .eq i:nth-child(2) { animation-delay: .15s; height: 70%; }
    .eq i:nth-child(3) { animation-delay: .3s; }
    .eq.pause i { animation: none; height: 30% !important; }
    @keyframes bounce {
      0%, 100% { height: 30%; }
      50% { height: 90%; }
    }
    .loot-card {
      display: flex; justify-content: space-between; align-items: center;
      background: #fff; border-radius: 20px; padding: 14px; margin-bottom: 8px;
    }
    .toast {
      position: fixed; left: 50%; top: 18px; transform: translateX(-50%);
      background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px;
      font-weight: 800; z-index: 20; display: none;
    }
    .gate { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
    .gate .card { width: min(430px, 100%); }
    .field { width: 100%; border: 0; background: #fff; border-radius: 16px; padding: 12px 14px; margin-top: 8px; }
    .hidden { display: none !important; }
    .progress {
      height: 8px; background: #efe6f4; border-radius: 99px; overflow: hidden; margin: 10px 0 4px;
    }
    .progress b { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--bloom), var(--violet)); }
    @media (prefers-reduced-motion: reduce) {
      .eq i { animation: none; height: 50%; }
    }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>
  <div id="gate" class="gate"></div>
  <div id="app" class="app hidden"></div>
  <nav class="dock hidden" id="dock"></nav>
<script>
const QUESTS = [
  { id: "kitchen", cat: "cooking", icon: "🍳", title: "Reset the kitchen", minutes: 15, xp: 40, loot: 14, energy: ["low","okay","charged"],
    first: "Put one mug in the dishwasher or sink.",
    steps: ["Clear just the sink.", "Wipe one bench patch.", "Start or empty the dishwasher."],
    boost: "Kettle Tempo", calm: "Warm Porcelain" },
  { id: "dinner", cat: "cooking", icon: "🥗", title: "Make a real dinner", minutes: 25, xp: 55, loot: 18, energy: ["okay","charged"],
    first: "Take the pan out and put it on the stove. Do not cook yet.",
    steps: ["Add one ingredient you already have.", "Turn the heat on.", "Plate it, even if it is simple."],
    boost: "Chop Chop", calm: "Simmer Down" },
  { id: "wash", cat: "cleaning", icon: "🧺", title: "Start a load of washing", minutes: 8, xp: 28, loot: 10, energy: ["frozen","low","okay"],
    first: "Pick up 5 pieces of clothing. Only 5.",
    steps: ["Open the machine.", "Add soap if you can see it.", "Press start. Walk away."],
    boost: "Spin Cycle", calm: "Laundry Rain" },
  { id: "floor", cat: "cleaning", icon: "🧹", title: "Clear a walking path", minutes: 10, xp: 32, loot: 12, energy: ["low","okay"],
    first: "Move 3 things off the floor into a chair or basket.",
    steps: ["Choose one room.", "Fill one bag or basket.", "Stop at 10 minutes."],
    boost: "Pathfinder", calm: "Soft Sweep" },
  { id: "shower", cat: "care", icon: "🛁", title: "Take a shower", minutes: 12, xp: 36, loot: 12, energy: ["frozen","low","okay","charged"],
    first: "Put a towel where you can see it.",
    steps: ["Turn the water on.", "Step in for 2 minutes.", "Soap one area. Done counts."],
    boost: "Steam Up", calm: "Rain Booth" },
  { id: "water", cat: "care", icon: "💧", title: "Drink water and take meds", minutes: 3, xp: 18, loot: 6, energy: ["frozen","low","okay","charged"],
    first: "Fill a glass. Do not drink yet if that helps.",
    steps: ["Take the sip.", "Put meds next to the glass.", "Swallow, then tick it."],
    boost: "Bright Sip", calm: "Still Water" },
  { id: "mail", cat: "admin", icon: "📬", title: "Open one piece of mail", minutes: 7, xp: 30, loot: 11, energy: ["okay","charged"],
    first: "Pick up one envelope. Leave the rest.",
    steps: ["Open it.", "Write one next action on the back.", "Put it in a done pile."],
    boost: "Inbox Boss", calm: "Paper Quiet" },
  { id: "appt", cat: "admin", icon: "📅", title: "Book or confirm one appointment", minutes: 6, xp: 34, loot: 12, energy: ["okay","charged"],
    first: "Open the booking app or find the number. Stop there.",
    steps: ["Choose a day that is fine, not perfect.", "Book it.", "Add it to your phone calendar."],
    boost: "Call Courage", calm: "Hold Music" }
];

const CARDS = [
  { id: "wool", name: "Woolworths", cost: 80, value: "$10" },
  { id: "coles", name: "Coles", cost: 80, value: "$10" },
  { id: "uber", name: "Uber Eats", cost: 70, value: "$10" },
  { id: "spot", name: "Spotify", cost: 90, value: "$15" },
  { id: "kmart", name: "Kmart", cost: 60, value: "$10" },
  { id: "chem", name: "Chemist Warehouse", cost: 75, value: "$10" }
];

const defaultState = () => ({
  name: "", zones: [], music: "both", onboarded: false,
  energy: "okay", tab: "today", xp: 20, loot: 24, streak: 1,
  lastClear: null, custom: [], active: null, step: 0,
  soundMode: "calm", playing: false, biome: "home",
  connected: { spotify: false, apple: false }, plan: "free",
  history: []
});

let state = load();
let audio = { ctx: null, nodes: [], timer: null };

function load() {
  try {
    const raw = localStorage.getItem("clears-state");
    return raw ? { ...defaultState(), ...JSON.parse(raw) } : defaultState();
  } catch { return defaultState(); }
}
function save() { localStorage.setItem("clears-state", JSON.stringify(state)); }
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.style.display = "block";
  setTimeout(() => el.style.display = "none", 2200);
}
function todayKey() { return new Date().toISOString().slice(0,10); }
function allQuests() { return QUESTS.concat(state.custom); }
function recommended() {
  const pool = allQuests().filter(q => !state.history.includes(q.id) && (q.energy || ["okay"]).includes(state.energy));
  const prefer = pool.filter(q => !state.zones.length || state.zones.includes(q.cat));
  return (prefer[0] || pool[0] || allQuests()[0]);
}

function startAudio(mode) {
  stopAudio();
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  const ctx = new Ctx();
  audio.ctx = ctx;
  const master = ctx.createGain(); master.gain.value = 0.04; master.connect(ctx.destination);
  const notes = mode === "boost" ? [196, 247, 294, 392] : [174, 220, 261];
  notes.forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = mode === "boost" ? "triangle" : "sine";
    osc.frequency.value = freq;
    g.gain.value = 0;
    osc.connect(g); g.connect(master);
    osc.start();
    const pulse = () => {
      const now = ctx.currentTime;
      g.gain.cancelScheduledValues(now);
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(mode === "boost" ? 0.18 : 0.12, now + 0.05);
      g.gain.exponentialRampToValueAtTime(0.001, now + (mode === "boost" ? 0.35 : 1.6));
    };
    pulse();
    const id = setInterval(pulse, mode === "boost" ? 420 + i * 40 : 1800 + i * 200);
    audio.nodes.push({ osc, g, id });
  });
}
function stopAudio() {
  audio.nodes.forEach(n => { clearInterval(n.id); try { n.osc.stop(); } catch(e) {} });
  audio.nodes = [];
  if (audio.ctx) { audio.ctx.close(); audio.ctx = null; }
}

function renderGate() {
  const g = document.getElementById("gate");
  if (state.onboarded) { g.classList.add("hidden"); return; }
  g.classList.remove("hidden");
  g.innerHTML = `<div class="card">
    <p class="kicker">Clears</p>
    <h2 class="serif" style="margin:0 0 8px">Your brain knows the quest.</h2>
    <p class="lede">Starting it is the boss fight. This is a daily-living game for ADHD and other neurodivergent minds. Less guilt. More clears.</p>
    <label class="meta">What should we call you?</label>
    <input class="field" id="name" placeholder="First name" value="${state.name}" />
    <p class="meta" style="margin-top:14px">Where do you freeze most?</p>
    <div class="chips" id="zones">
      ${[["cooking","Cooking"],["cleaning","Cleaning"],["care","Self-care"],["admin","Life admin"]].map(([id,l]) =>
        `<button class="chip ${state.zones.includes(id)?"on":""}" data-z="${id}">${l}</button>`).join("")}
    </div>
    <p class="meta" style="margin-top:14px">Soundtrack default</p>
    <div class="chips">
      ${[["boost","Lift me up"],["calm","Calm me down"],["both","Both"]].map(([id,l]) =>
        `<button class="chip ${state.music===id?"on":""}" data-m="${id}">${l}</button>`).join("")}
    </div>
    <button class="btn primary wide" id="enter">Enter today's map</button>
  </div>`;
  g.querySelector("#zones").onclick = e => {
    const z = e.target.dataset.z; if (!z) return;
    state.zones = state.zones.includes(z) ? state.zones.filter(x => x!==z) : state.zones.concat(z);
    renderGate();
  };
  g.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { state.music = b.dataset.m; state.soundMode = b.dataset.m === "boost" ? "boost" : "calm"; renderGate(); });
  g.querySelector("#enter").onclick = () => {
    state.name = g.querySelector("#name").value.trim() || "player";
    state.onboarded = true; save(); boot();
  };
}

function dock() {
  const tabs = [["today","✨","Today"],["quests","🏺","Quests"],["sound","🎵","Sound"],["loot","🏆","Loot"],["you","🌟","You"]];
  document.getElementById("dock").innerHTML = tabs.map(([id,i,l]) =>
    `<button class="navbtn ${state.tab===id?"on":""}" data-t="${id}"><span>${i}</span>${l}</button>`).join("");
  document.getElementById("dock").onclick = e => {
    const t = e.target.closest("[data-t]"); if (!t) return;
    state.tab = t.dataset.t; save(); render();
  };
}

function header() {
  return `<div class="top">
    <div class="brand"><div class="logo">✦</div><div><b>Clears</b><small>Play the day</small></div></div>
    <div class="pills"><div class="stat">🔥 ${state.streak}</div><div class="stat">XP ${state.xp}</div><div class="stat">✦ ${state.loot}</div></div>
  </div>`;
}

function renderToday() {
  const q = recommended();
  const hour = new Date().getHours();
  const hello = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
  return `${header()}
    <section class="hero">
      <p class="kicker">${hello}${state.name ? ", " + state.name : ""}</p>
      <h2>Starting is the boss fight.</h2>
      <p class="lede">Check your energy. We will only put one main quest in front of you.</p>
      <div class="chips">
        ${[["frozen","Frozen"],["low","Low"],["okay","Okay"],["charged","Charged"]].map(([id,l]) =>
          `<button class="chip ${state.energy===id?"on":""}" data-e="${id}">${l}</button>`).join("")}
      </div>
    </section>
    <section class="card">
      <p class="kicker">Main quest</p>
      ${questRow(q, true)}
      <div class="row">
        <button class="btn primary" data-start="${q.id}">Start the boss fight</button>
        <button class="btn ghost" data-two="${q.id}">Just 2 minutes</button>
      </div>
    </section>
    <section class="card">
      <p class="kicker">Side quests</p>
      ${allQuests().filter(x => x.id !== q.id).slice(0,3).map(x => questRow(x)).join("")}
    </section>`;
}

function questRow(q, big) {
  return `<button class="quest" data-open="${q.id}">
    <div class="badge">${q.icon || "✦"}</div>
    <div><b>${q.title}</b><div class="meta">${q.minutes || 10} min · ${q.cat}</div></div>
    <div class="xp">+${q.xp} XP</div>
  </button>${big ? `<p class="lede" style="margin:8px 0 0">First step: ${q.first}</p>` : ""}`;
}

function renderQuests() {
  const cats = [["cooking","Cooking"],["cleaning","Cleaning"],["care","Self-care"],["admin","Life admin"]];
  return `${header()}
    <section class="card">
      <p class="kicker">Brain dump</p>
      <p class="lede">Write the thing. We will turn it into a tiny mission.</p>
      <input class="field" id="dump" placeholder="e.g. reply to that email" />
      <button class="btn primary wide" id="addDump">Make it a quest</button>
    </section>
    ${cats.map(([id,l]) => `<section class="card"><p class="kicker">${l}</p>
      ${allQuests().filter(q => q.cat===id).map(q => questRow(q)).join("") || "<p class='lede'>Nothing here yet.</p>"}
    </section>`).join("")}`;
}

function renderActive() {
  const q = allQuests().find(x => x.id === state.active);
  if (!q) { state.active = null; return renderToday(); }
  const steps = [q.first].concat(q.steps || []);
  const step = steps[state.step] || q.first;
  const pct = Math.round((state.step / steps.length) * 100);
  return `${header()}
    <section class="hero">
      <p class="kicker">${q.cat} · ${q.minutes} min</p>
      <h2>${q.title}</h2>
      <div class="progress"><b style="width:${pct}%"></b></div>
      <p class="meta">Spark is sitting with you. You do not have to finish the mountain.</p>
    </section>
    <div class="step">
      <p class="kicker">${state.step === 0 ? "Boss fight: begin" : "Next clear"}</p>
      <p>${step}</p>
    </div>
    <div class="player ${state.playing ? "" : ""}">
      <div class="eq ${state.playing ? "" : "pause"}"><i></i><i></i><i></i></div>
      <div style="flex:1"><b>${state.soundMode === "boost" ? q.boost : q.calm}</b><div class="meta" style="color:#d7cbe4">${state.soundMode} · ${state.biome}</div></div>
      <button class="btn" id="togglePlay">${state.playing ? "Pause" : "Play"}</button>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="doneStep">I did this</button>
      <button class="btn ghost" id="skipStep">Skip step</button>
    </div>
    <div class="row">
      <button class="btn calm" id="froze">I froze</button>
      <button class="btn ghost" id="park">Park quest</button>
    </div>`;
}

function renderSound() {
  return `${header()}
    <section class="hero">
      <p class="kicker">Soundtrack</p>
      <h2>Lift you up or calm you down.</h2>
      <p class="lede">Match the mix to your mood and the room you are in so starting gets easier.</p>
      <div class="chips">
        <button class="chip ${state.soundMode==="boost"?"on":""}" data-mode="boost">Boost</button>
        <button class="chip ${state.soundMode==="calm"?"on":""}" data-mode="calm">Calm</button>
      </div>
    </section>
    <section class="card">
      <p class="kicker">Biome</p>
      <div class="chips">
        ${[["home","Home"],["kitchen","Kitchen"],["outside","Outside"],["night","Night"]].map(([id,l]) =>
          `<button class="chip ${state.biome===id?"on":""}" data-b="${id}">${l}</button>`).join("")}
      </div>
    </section>
    <section class="card">
      <div class="player">
        <div class="eq ${state.playing?"":"pause"}"><i></i><i></i><i></i></div>
        <div style="flex:1"><b>${state.soundMode==="boost" ? "Launch mix" : "Soften mix"}</b><div class="meta" style="color:#d7cbe4">Generated pad · low volume</div></div>
        <button class="btn" id="togglePlay">${state.playing?"Pause":"Play"}</button>
      </div>
      <p class="lede" style="margin-top:12px">Connect a library when you want your own songs.</p>
      <div class="row">
        <button class="btn ${state.connected.spotify?"primary":"ghost"}" id="spot">${state.connected.spotify?"Spotify on":"Connect Spotify"}</button>
        <button class="btn ${state.connected.apple?"primary":"ghost"}" id="apple">${state.connected.apple?"Apple Music on":"Connect Apple Music"}</button>
      </div>
    </section>`;
}

function renderLoot() {
  return `${header()}
    <section class="hero">
      <p class="kicker">Real loot</p>
      <h2>Not badges. Gift cards.</h2>
      <p class="lede">You have <b>${state.loot} loot coins</b>. Clears convert daily living into something you can actually spend.</p>
    </section>
    ${CARDS.map(c => `<div class="loot-card">
      <div><b>${c.name}</b><div class="meta">${c.value} card · ${c.cost} coins</div></div>
      <button class="btn ${state.loot>=c.cost?"primary":"ghost"}" data-buy="${c.id}">Redeem</button>
    </div>`).join("")}
    <p class="lede">Demo only. No real charge or fulfilment yet.</p>`;
}

function renderYou() {
  const toNext = 100 - (state.xp % 100);
  return `${header()}
    <section class="hero">
      <p class="kicker">You</p>
      <h2>${state.name || "Player"}'s campaign</h2>
      <p class="lede">Streak ${state.streak} · ${state.history.length} clears · level ${Math.floor(state.xp/100)+1}</p>
      <div class="progress"><b style="width:${state.xp%100}%"></b></div>
      <p class="meta">${toNext} XP to next level</p>
    </section>
    <section class="card">
      <p class="kicker">Cloud</p>
      <p class="lede">Saved on this device. Cloud sync is a Plus feature in the full product.</p>
    </section>
    <section class="card">
      <p class="kicker">Plans</p>
      ${[["free","Free","Today, quests, local save"],["plus","Plus","Cloud, extra loot, AI breakdowns"],["studio","Studio","Household co-op and higher cards"]].map(([id,n,d]) =>
        `<button class="quest" data-plan="${id}"><div class="badge">${id==="studio"?"✨":"✦"}</div><div><b>${n}</b><div class="meta">${d}</div></div><div class="xp">${state.plan===id?"On":"Pick"}</div></button>`).join("")}
    </section>
    <button class="btn ghost wide" id="reset">Reset this demo</button>`;
}

function bind(root) {
  root.querySelectorAll("[data-e]").forEach(b => b.onclick = () => { state.energy = b.dataset.e; save(); render(); });
  root.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openQuest(b.dataset.open));
  root.querySelectorAll("[data-start]").forEach(b => b.onclick = () => openQuest(b.dataset.start, true));
  root.querySelectorAll("[data-two]").forEach(b => b.onclick = () => openQuest(b.dataset.two, true));
  root.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { state.soundMode = b.dataset.mode; save(); render(); if (state.playing) startAudio(state.soundMode); });
  root.querySelectorAll("[data-b]").forEach(b => b.onclick = () => { state.biome = b.dataset.b; save(); render(); });
  root.querySelectorAll("[data-buy]").forEach(b => b.onclick = () => buy(b.dataset.buy));
  root.querySelectorAll("[data-plan]").forEach(b => b.onclick = () => { state.plan = b.dataset.plan; save(); toast(state.plan + " selected"); render(); });
  const play = root.querySelector("#togglePlay");
  if (play) play.onclick = () => {
    state.playing = !state.playing;
    if (state.playing) startAudio(state.soundMode); else stopAudio();
    save(); render();
  };
  const add = root.querySelector("#addDump");
  if (add) add.onclick = () => {
    const v = root.querySelector("#dump").value.trim();
    if (!v) return toast("Park a thought in the box first.");
    state.custom.unshift({ id: "c"+Date.now(), cat: state.zones[0] || "admin", icon: "✦", title: v, minutes: 8, xp: 22, loot: 8, energy: ["frozen","low","okay","charged"], first: "Open the thing or stand up. That is the whole first step.", steps: ["Do the smallest visible action.", "Stop after 8 minutes if you want."], boost: "Tiny Launch", calm: "Soft Start" });
    save(); toast("Quest added. No guilt if it waits."); render();
  };
  const ds = root.querySelector("#doneStep");
  if (ds) ds.onclick = nextStep;
  const sk = root.querySelector("#skipStep");
  if (sk) sk.onclick = nextStep;
  const fr = root.querySelector("#froze");
  if (fr) fr.onclick = () => { toast("Still here. Try the first step again, smaller."); state.step = 0; save(); render(); };
  const pk = root.querySelector("#park");
  if (pk) pk.onclick = () => { state.active = null; state.tab = "today"; save(); toast("Parked. That counts as taking care of you."); render(); };
  const sp = root.querySelector("#spot");
  if (sp) sp.onclick = () => { state.connected.spotify = !state.connected.spotify; save(); toast(state.connected.spotify ? "Spotify connected (demo)" : "Spotify off"); render(); };
  const ap = root.querySelector("#apple");
  if (ap) ap.onclick = () => { state.connected.apple = !state.connected.apple; save(); toast(state.connected.apple ? "Apple Music connected (demo)" : "Apple Music off"); render(); };
  const rs = root.querySelector("#reset");
  if (rs) rs.onclick = () => { stopAudio(); state = defaultState(); save(); boot(); };
}

function openQuest(id, play) {
  const q = allQuests().find(x => x.id === id); if (!q) return;
  state.active = id; state.step = 0; state.tab = "active";
  if (play) { state.playing = true; startAudio(state.soundMode); }
  save(); render();
}
function nextStep() {
  const q = allQuests().find(x => x.id === state.active); if (!q) return;
  const steps = [q.first].concat(q.steps || []);
  if (state.step + 1 >= steps.length) return clearQuest(q);
  state.step += 1; save(); render();
}
function clearQuest(q) {
  state.xp += q.xp; state.loot += q.loot;
  if (state.lastClear !== todayKey()) { state.streak += 1; state.lastClear = todayKey(); }
  state.history.push(q.id); state.active = null; state.tab = "today"; state.playing = false; stopAudio();
  save(); toast(`Cleared. +${q.xp} XP · +${q.loot} loot`); render();
}
function buy(id) {
  const c = CARDS.find(x => x.id === id);
  if (state.loot < c.cost) return toast("Need more clears for that card.");
  state.loot -= c.cost; save(); toast(`${c.name} ${c.value} parked in loot (demo)`); render();
}

function render() {
  const app = document.getElementById("app");
  const map = { today: renderToday, quests: renderQuests, sound: renderSound, loot: renderLoot, you: renderYou, active: renderActive };
  app.innerHTML = (map[state.tab] || renderToday)();
  bind(app);
  dock();
}
function boot() {
  document.getElementById("gate").classList.toggle("hidden", state.onboarded);
  document.getElementById("app").classList.toggle("hidden", !state.onboarded);
  document.getElementById("dock").classList.toggle("hidden", !state.onboarded);
  if (!state.onboarded) renderGate(); else render();
}
boot();
</script>
</body>
</html>
